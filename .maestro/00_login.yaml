# Golden path: admin login → TodayScreen renders.
# Catches: JS bundle fails to boot, api.js request() throws before auth,
# Hermes-missing API calls during login, LoginScreen crashes on render.
appId: ca.getclipd.app
env:
  TEST_SHOP_SLUG: ${MAESTRO_TEST_SHOP_SLUG}
  TEST_SHOP_PASSWORD: ${MAESTRO_TEST_SHOP_PASSWORD}
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible: "Clip"    # brand header ("Clipd")

# Log in as admin.
- tapOn:
    text: "Shop ID"
    optional: true
- tapOn:
    id: "field1"
    optional: true
- inputText: ${TEST_SHOP_SLUG}
- tapOn:
    text: "Password"
- inputText: ${TEST_SHOP_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Sign In"

# After login we land on TodayScreen. Its "Today" strip label is the
# quickest screen marker to assert — it's rendered above any async data,
# so the flow stops waiting on network if something there explodes.
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 15000
